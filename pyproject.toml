[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phobos-agent"
version = "0.1.0"
description = "Phobos Agent: an authorized offensive security agent runtime with ROE guardrails and evidence logging."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Hermes Agent"}]
license = {text = "MIT"}

[project.scripts]
phobos-harness = "phobos_agent.cli:main"
phobos-agent = "phobos_agent.agent_cli:main"
offsec-harness = "offsec_agent_harness.cli:main"
offsec-agent = "offsec_agent_harness.agent_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
